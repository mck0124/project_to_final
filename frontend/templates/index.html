<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroupBy - 시작하기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0faf6;
      font-family: 'Arial', sans-serif;
      color: #333;
    }
    .navbar-brand {
      color: #2dc997;
      font-weight: bold;
      font-size: 1.5rem;
    }
    .main-section {
      padding: 6rem 2rem;
      text-align: center;
    }
    .main-title {
      font-size: 2.5rem;
      font-weight: bold;
      color: #30c59b;
    }
    .main-subtitle {
      font-size: 1.1rem;
      margin-top: 1rem;
      color: #555;
    }
    .cta-button {
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      font-size: 1.2rem;
      background-color: #2dc997;
      border: none;
      border-radius: 30px;
      color: white;
      font-weight: bold;
    }
    .cta-button:hover {
      background-color: #28b78a;
    }
  </style>
</head>
<body>

  <!-- 네비게이션바 -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4">
    <a class="navbar-brand" href="#">KOSA</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item mx-2"><a class="nav-link" href="#">스카우트 제안받기</a></li>
        <li class="nav-item mx-2"><a class="nav-link" href="#">채용 공고</a></li>
        <li class="nav-item mx-2"><a class="nav-link" href="#">채용 프로그램</a></li>
        <li class="nav-item mx-2"><a class="nav-link" href="#">블로그</a></li>
        <li class="nav-item mx-2"><a class="nav-link" href="#">이력서 분석기</a></li>
        <li class="nav-item mx-2">
          <a class="btn btn-outline-success" href="/login">회원가입 / 로그인</a>
        </li>
        <li class="nav-item mx-2">
          <a class="btn btn-success" href="#">기업 서비스</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- 메인 섹션 -->
  <section class="main-section">
    <h1 class="main-title">검증된 인재에게 먼저 제안하세요</h1>
    <p class="main-subtitle">AI가 분석한 우수 개발자와 지금 연결해보세요. <br> 매달 수백 명이 새로운 기업을 만나고 있어요.</p>
    <a href="/login"><button class="cta-button">👉 3초만에 가입하고 인재 찾기</button></a>
  </section>

</body>
</html>
